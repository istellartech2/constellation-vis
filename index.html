<!DOCTYPE html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking first paint; text uses the fallback font until it arrives. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <script>
      // Apply the saved UI theme before first paint to avoid a flash.
      try {
        var t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("cv-ui-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}

      // Start downloading the first earth images now instead of after the
      // scripts have loaded; src/lib/earthTextureLoader.ts picks these up.
      // Keep the file lists in sync with EARTH_ASSETS (earthTextures.test.ts checks).
      (function () {
        var mode = "natural-earth";
        try {
          var saved = JSON.parse(localStorage.getItem("constellation-vis:lastView") || "null");
          var stored = saved && saved.display && saved.display.earthTexture;
          var legacy = { "./assets/earth01.webp": "blue-marble", "./assets/earth02.webp": "natural-earth", "high-resolution": "natural-earth" };
          if (typeof stored === "string") mode = legacy[stored] || stored;
        } catch (e) {}
        var files = {
          "blue-marble": ["day-blue-marble-4k", "ocean-mask-2k", "night-lights-2k", "relief-2k"],
          "natural-earth": ["day-natural-4k", "ocean-mask-2k", "night-lights-2k", "relief-2k"],
          "dark-monochrome": ["ocean-mask-2k", "country-borders-4k"],
          "paper-atlas": ["ocean-mask-2k", "country-borders-4k"],
        }[mode];
        if (!files || typeof fetch !== "function") return;
        var prefetch = (window.__earthPrefetch = {});
        files.forEach(function (name) {
          var url = new URL("./assets/earth/" + name + ".webp", document.baseURI).href;
          var request = fetch(url).then(function (response) {
            if (!response.ok) throw new Error(url + ": HTTP " + response.status);
            return response.blob();
          });
          request.catch(function () {});
          prefetch[url] = request;
        });
      })();
    </script>
    <style>
      /* Startup overlay; removed by hideBootSplash() once the globe is drawn. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #07090d;
        color: #9aa4b2;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
        transition: opacity 0.35s ease;
      }
      [data-theme="light"] #boot-splash {
        background: #eef0f3;
        color: #5b6573;
      }
      #boot-splash[data-state="done"] {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-globe {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #2a5a9a, #0a1a38 70%);
        box-shadow: 0 0 24px rgba(80, 150, 255, 0.25);
      }
      #boot-splash .boot-globe::after {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #f07214;
        animation: boot-orbit 1.1s linear infinite;
      }
      @keyframes boot-orbit {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-globe::after {
          animation-duration: 3s;
        }
      }
    </style>
    <title>Constellation Viewer</title>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-globe"></div>
      <div id="boot-splash-status">読み込み中…</div>
    </div>
    <script>
      // Never leave the overlay up if the globe fails to report in.
      setTimeout(function () {
        var splash = document.getElementById("boot-splash");
        if (splash) splash.remove();
      }, 20000);
    </script>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
